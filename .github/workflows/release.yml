name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: brew install cmake
      - name: Test
        run: scripts/test.sh
      - name: Package
        run: scripts/package.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/NotchCurtain-*-macos.zip dist/NotchCurtain-*.dmg dist/SHA256SUMS --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
