name: Bug Report
description: Report an issue, crash, or unexpected behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you are testing on macOS 14+ on a MacBook with a physical camera notch.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Start Claude Code or Codex in terminal
        2. Hover over the MacBook notch
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: e.g., macOS 14.5 Sonoma, macOS 15.0 Sequoia
      placeholder: "macOS 14.6.1"
    validations:
      required: true
  - type: input
    id: hardware-model
    attributes:
      label: Mac Hardware Model
      description: e.g., MacBook Pro 14" M3 Pro, MacBook Air 15" M2
      placeholder: "MacBook Air 15\" M2"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: NotchCurtain App Version
      description: e.g., 0.1.0 or Git commit SHA
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Copy relevant logs from Console.app (subsystem: app.notchbar.Notch) or terminal.
      render: shell
